# options.yaml — tujuh jalur untuk memposting ke media sosial, dengan biayanya.
#
# Ini yang dibaca `lib/advisor.py` saat kamu bertanya "sebaiknya pakai apa?".
# Tidak ada jalur yang dilarang di sini. Yang ada: apa konsekuensinya, untuk
# siapa cocok, dan apa alternatif yang bentuknya lebih baik.
#
# Field yang perlu dijelaskan:
#   risk           risiko akun kena batasi/blokir. bukan risiko teknis.
#   tos            compliant | gray | violation — status terhadap syarat layanan
#   skill_required 1 (bisa pakai HP) .. 5 (nyaman baca log server)
#   tier           tier tata kelola dari references/tiers.md di skill email
#   reversible     kalau salah, seberapa mudah dibatalkan

version: 1
updated: 2026-08-14

options:

  # =========================================================================
  - id: manual-native
    name: "Manual + penjadwal bawaan platform"
    tagline: "Hermes menulis, kamu yang menekan tombol post."
    tier: T3
    risk: none
    tos: compliant
    skill_required: 1
    setup_hours: [0, 0.5]
    cost_usd_month: {min: 0, max: 0, note: "gratis selamanya"}
    platforms: [instagram, threads, facebook, x, tiktok, linkedin]
    volume_ceiling_per_week: 15
    reversible: "penuh — kamu melihat setiap post sebelum tayang"
    what_hermes_does:
      - "menulis draft caption dari arsip konten + suara brand kamu"
      - "menyiapkan kalender terbit dan mengingatkan lewat Telegram"
      - "mengecek pengulangan: 'kalimat pembuka ini sudah kamu pakai 3x bulan lalu'"
      - "menyimpan setiap post yang tayang ke arsip untuk analisis"
    drawbacks:
      - "kamu tetap harus buka aplikasi dan menempel manual"
      - "tidak jalan saat kamu tidur atau sedang tidak pegang HP"
      - "di atas ~15 post/minggu ini melelahkan dan mulai bolong"
    implications:
      - "waktu kamu jadi bottleneck — itu jujur, dan kadang memang benar begitu"
      - "tidak ada satu pun risiko akun. nol."
    when_to_pick:
      - "audiens kamu kecil dan kenal kamu secara personal"
      - "akun ini tidak tergantikan (satu-satunya kanal jualan)"
      - "kamu baru mulai dan belum tahu konten apa yang jalan"
    when_not_to:
      - "kamu mengelola 5+ akun klien"
      - "volume di atas 15 post/minggu"
    alternatives: [saas-scheduler, selfhost-scheduler]
    evidence: []
    persona_fit: [P2, P3, P6]

  # =========================================================================
  - id: saas-scheduler
    name: "Penjadwal SaaS (Buffer, Later, Publer, Metricool)"
    tagline: "Jalur main aman. Bayar orang lain untuk menanggung risikonya."
    tier: T3
    risk: none
    tos: compliant
    skill_required: 1
    setup_hours: [0.5, 2]
    cost_usd_month: {min: 0, max: 30, note: "Buffer Free 3 kanal; Essentials $5/KANAL/bulan"}
    platforms: [instagram, threads, facebook, x, tiktok, linkedin, youtube, pinterest, bluesky, mastodon]
    volume_ceiling_per_week: 100
    reversible: "penuh — antrian bisa diedit/dibatalkan sebelum tayang"
    what_hermes_does:
      - "menulis draft, kamu tempel ke antrian penjadwal"
      - "menjaga kalender dan arsip di sisi kamu, bukan di SaaS-nya"
      - "mengingatkan kalau antrian mau habis"
    drawbacks:
      - "harga per KANAL. 3 kanal Buffer Essentials = $15/bulan, bukan $5"
      - "gratisannya 10 post terjadwal per kanal — habis cepat"
      - "kalender, arsip, dan data audiens kamu ada di server mereka"
      - "kalau harga naik atau fiturnya dipotong, kamu tidak bisa apa-apa"
      - "tidak ada jalur API untuk Hermes di paket murah — tetap tempel manual"
    implications:
      - "biaya naik seiring jumlah kanal, bukan jumlah post"
      - "vendor lock-in ringan: memindahkan kalender keluar itu manual"
      - "untuk UU PDP: data audiens diproses pihak ketiga, dan kamu tetap pengendalinya"
    when_to_pick:
      - "kamu ingin mulai minggu ini tanpa memikirkan server"
      - "1–3 kanal, volume sedang"
      - "kamu tidak nyaman dengan terminal, dan itu tidak apa-apa"
    when_not_to:
      - "kamu punya 5+ kanal (biayanya jadi tidak masuk akal)"
      - "kamu ingin Hermes benar-benar menekan tombol publish"
    alternatives: [selfhost-scheduler, official-api]
    evidence: [buffer-pricing]
    persona_fit: [P3, P4, P6]

