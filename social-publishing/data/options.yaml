  # Ditambahkan 2026-08-14. Fakta harga & fitur dari halaman yang benar-benar
  # dibuka: https://repliz.com/ dan https://repliz.com/pricing (13 Agu 2026).
  # Halaman /documentation GAGAL dibuka saat itu, jadi tidak ada satu pun nama
  # endpoint di sini — lihat references/repliz.md sebelum menulis integrasi.
  - id: repliz
    name: "Repliz (lokal Indonesia — komentar, DM, jadwal)"
    tagline: "Pintu depan yang harganya di bawah segelas kopi."
    tier: T2
    risk: none
    tos: compliant
    skill_required: 1
    setup_hours: [0.5, 1.5]
    cost_usd_month: {min: 0, max: 4, note: "Rp0 Free (1 akun, TANPA API); Rp18.000 Standard (20 akun, API limited + webhook); Rp29.000 Premium; Rp49.000 Gold (API full). Sekali bayar, klaim tanpa perpanjangan otomatis"}
    platforms: [instagram, facebook, threads, tiktok, youtube]
    volume_ceiling_per_week: 200
    reversible: "penuh — aturan otomasi bisa dimatikan kapan saja, per akun"
    what_hermes_does:
      - "menulis draft balasan & caption pakai suara brand dari profile.yaml"
      - "menyiapkan aturan otomasi, pemiliknya yang menyalakan"
      - "menarik pertanyaan yang naik ke antrean handoff.py supaya dijawab sekali"
      - "TIDAK menulis ulang apa yang sudah disediakan Repliz — tidak ada poller komentar buatan sendiri"
    drawbacks:
      - "paket Free TIDAK punya Public API maupun webhook — minimum Standard untuk dipakai bersama Hermes"
      - "tidak menyentuh WhatsApp sama sekali (pakai waha-marketing)"
      - "tidak menyentuh email sama sekali (pakai email-marketing)"
      - "LinkedIn disebut di halaman depan tapi tidak muncul di tabel paket — cek sendiri sebelum menjanjikan"
      - "dokumentasi API gagal dibuka saat data ini dikumpulkan; jangan tulis endpoint dari tebakan"
      - "produk pihak ketiga: kalau harga atau fiturnya berubah, kamu tidak bisa apa-apa"
    implications:
      - "biaya naik per jumlah akun, bukan per post — kebalikan dari penjadwal SaaS luar"
      - "menyambung lewat integrasi resmi platform, jadi ini jalur yang membuat garis merah computer-use bisa dipatuhi tanpa kehilangan kemampuan"
      - "balasan otomatis tetap tunduk penuh pada automation-posture.md: draft → faq → penuh"
      - "komentar publik adalah tempat paling gampang menaruh kalimat berbentuk perintah — Rule 8 berlaku"
    when_to_pick:
      - "komentar/DM masuk lebih cepat dari yang bisa dibalas satu-satu"
      - "pegang beberapa akun (klien atau brand sendiri) dan butuh satu kotak masuk"
      - "butuh jadwal posting tanpa membayar per kanal"
      - "pemiliknya orang Indonesia dan pembayaran rupiah itu penting"
    when_not_to:
      - "kanal utamanya WhatsApp — Repliz tidak menyentuhnya"
      - "kanal utamanya email — Repliz tidak menyentuhnya"
      - "FAQ-nya belum ada. Bikin FAQ dulu bareng pemiliknya, baru nyalakan otomasi"
    alternatives: [saas-scheduler, official-api, manual-native]
    evidence: [repliz-home, repliz-pricing]
    persona_fit: [P1, P3, P4, P6]

  # =========================================================================
  - id: official-api
    name: "Adapter API resmi (Meta Graph untuk IG/Threads, X API berbayar)"
    tagline: "Hermes benar-benar mempublikasikan, lewat pintu depan, dengan kuota tertulis."
    tier: T2
    risk: low
    tos: compliant
    skill_required: 4
    setup_hours: [4, 16]
    cost_usd_month: {min: 0, max: 10, note: "Meta gratis; X $0.015/post ($0.200 kalau ada URL)"}
    platforms: [instagram, threads, facebook, x]
    volume_ceiling_per_week: 700
    reversible: "post bisa dihapus lewat API; yang sudah dilihat orang tidak bisa ditarik"
    what_hermes_does:
      - "draft → kamu approve → publish → verifikasi post benar-benar tayang"
      - "menyimpan idempotency key supaya retry tidak menghasilkan post ganda"
      - "menghitung sisa kuota harian sebelum menjadwalkan"
    drawbacks:
      - "butuh akun profesional IG (Business/Creator) — akun pribadi tidak bisa"
      - "review aplikasi Meta memakan waktu dan kadang ditolak tanpa penjelasan jelas"
      - "IG API: JPEG saja, tanpa filter, tanpa shopping tag, carousel maks 10"
      - "post X dengan URL 13x lebih mahal ($0.200 vs $0.015)"
      - "token kedaluwarsa dan perlu diperpanjang — ini akan membangunkanmu suatu pagi"
      - "setup 4–16 jam, dan sebagian besar habis di dashboard Meta, bukan di kode"
    implications:
      - "ini satu-satunya jalur di mana Hermes benar-benar bisa publish tanpa melanggar apa pun"
      - "kuota tertulis berarti kamu bisa merencanakan, bukan menebak"
      - "biaya X per-post membuat 'posting sebanyak mungkin' jadi keputusan ekonomi, bukan gaya"
    when_to_pick:
      - "kamu sudah punya ritme konten yang jalan dan ingin menghapus langkah tempel-manual"
      - "akunnya akun bisnis profesional yang memang untuk itu"
      - "kamu (atau seseorang) nyaman mengurus OAuth"
    when_not_to:
      - "kamu belum tahu mau posting apa — otomasi tidak memperbaiki itu"
      - "tidak ada yang bisa memperpanjang token saat kamu cuti"
    alternatives: [selfhost-scheduler, saas-scheduler]
    evidence: [x-pricing, threads-overview, ig-content-publishing]
    persona_fit: [P4]

  # =========================================================================
  - id: selfhost-scheduler
    name: "Penjadwal self-host (Postiz / Mixpost Lite) di VPS sendiri"
    tagline: "OAuth resmi, antrian sendiri, data sendiri. Yang paling sering direkomendasikan riset."
    tier: T2
    risk: low
    tos: compliant
    skill_required: 3
    setup_hours: [2, 8]
    cost_usd_month: {min: 4, max: 15, note: "VPS $4–5 + domain; software gratis"}
    platforms: [instagram, threads, facebook, x, linkedin, youtube, bluesky, mastodon, tiktok]
    volume_ceiling_per_week: 200
    reversible: "antrian bisa diedit; tapi bug scheduler bisa membuat post ganda"
    what_hermes_does:
      - "menulis draft → masuk antrian Postiz → kamu approve dari HP → publish"
      - "Postiz punya CLI + MCP, jadi Hermes bisa memanggilnya sebagai tool"
      - "arsip, kalender, dan data audiens tetap di server kamu"
    drawbacks:
      - "issue tracker-nya sendiri melaporkan: post IG tersangkut di QUEUE (#1724),"
      - "reply/CTA X terjadwal tidak terkirim (#1581), publish gambar Threads gagal (#1364),"
      - "post terjadwal terlewat padahal 'Post Now' jalan (#1259)"
      - "#832: loop repost Instagram membuat akun DITANDAI — ini kegagalan paling mahal di daftar"
      - "kamu jadi sysadmin: update, backup, sertifikat, disk penuh jam 2 pagi"
      - "Mixpost Lite gratis dilaporkan TIDAK termasuk Instagram — cek dulu sebelum memilih"
      - "lisensi Postiz AGPL-3.0: kalau kamu jual sebagai layanan yang sudah dimodifikasi, sumbernya wajib dibuka"
    implications:
      - "pola kegagalannya spesifik dan berbahaya: SCHEDULER yang rusak, sementara 'Post Now' jalan"
      - "artinya bug ini TIDAK terlihat saat kamu demo di depan orang. Dia muncul minggu ketiga"
      - "karena itu: uji dua minggu dengan post asli sebelum mempercayakan jadwal ke dia"
    when_to_pick:
      - "5+ kanal, atau kamu mengelola akun klien"
      - "kamu sudah punya VPS dan tidak takut terminal"
      - "kepemilikan data itu penting untukmu (UU PDP, atau prinsip)"
    when_not_to:
      - "kamu satu-satunya orang teknis dan tidak punya waktu jadi sysadmin"
      - "kamu belum pernah menjalankan Docker sama sekali dan workshop-nya cuma 3 jam"
    alternatives: [official-api, saas-scheduler]
    evidence: [repo-stats, postiz-issues, mixpost-gating]
    persona_fit: [P4]

