    tier: T3
    risk: medium
    tos: gray
    skill_required: 4
    setup_hours: [3, 10]
    cost_usd_month: {min: 4, max: 8, note: "VPS $4–5; Tailscale gratis untuk personal"}
    platforms: [instagram, threads, x, tiktok, linkedin]
    volume_ceiling_per_week: 20
    reversible: "kamu melihat layarnya sebelum klik — sepenuhnya reversibel SELAMA kamu benar-benar melihat"
    what_hermes_does:
      - "menyiapkan sesi browser: buka composer, isi caption, unggah gambar — BERHENTI sebelum publish"
      - "kirim screenshot ke Telegram kamu"
      - "kamu buka layar VPS lewat Tailscale dari HP, periksa, klik post sendiri"
    drawbacks:
      - "rapuh. Selector berubah, login wall muncul, captcha muncul, sesi kedaluwarsa"
      - "satu operator melaporkan ~70% run gagal untuk alur browser-cron 5 menit (#78602)"
      - "composer X pernah menolak teks yang diketik program (#54879)"
      - "profil/sesi browser tidak stabil antar-run (#8824)"
      - "percakapan bisa salah rute antar-akun (#41483) — ini kelas kesalahan yang mengirim pesan ke orang yang salah"
      - "otomasi browser di area abu-abu ToS. X menyebut scripting situs non-API bisa berujung suspensi permanen"
    implications:
      - "ini jalur paling menarik untuk didemokan dan paling tidak bisa diandalkan untuk dipakai"
      - "aman selama manusia yang menekan tombol terakhir. Begitu kamu menambahkan --auto, kamu pindah ke jalur unofficial-api dengan kerapuhan ekstra"
      - "Tailscale-nya sendiri bukan risiko — dia justru yang membuat 'lihat dulu dari HP' jadi mungkin"
    when_to_pick:
      - "platformnya tidak punya API publish sama sekali"
      - "volume rendah (≤ 20/minggu) dan kamu memang akan melihat setiap satu"
      - "kamu senang mengurus hal yang kadang rusak"
    when_not_to:
      - "akunnya tidak tergantikan"
      - "kamu berharap ini jalan tanpa dijaga"
      - "kamu mengajarkannya ke 60 pemula dalam 3 jam"
    alternatives: [manual-native, official-api]
    evidence: [openclaw-browser-issues, x-automation-rules]
    persona_fit: [P4]

  # =========================================================================
  - id: unofficial-api
    name: "API tidak resmi (instagrapi, agent-twitter-client, twscrape)"
    tagline: "Jalan pintas yang bekerja sampai tidak. Ini bisa dilakukan — ini konsekuensinya."
    tier: T3
    risk: very_high
    tos: violation
    skill_required: 3
    setup_hours: [1, 4]
    cost_usd_month: {min: 0, max: 30, note: "gratis; proxy residensial $10–30 kalau ingin bertahan lebih lama"}
    platforms: [instagram, threads, x]
    volume_ceiling_per_week: 50
    reversible: "TIDAK. Akun yang dibanned Instagram jarang kembali, dan tidak ada nomor yang bisa ditelepon"
    what_hermes_does:
      - "login dengan kredensial/cookie akun kamu, lalu memanggil endpoint internal aplikasi"
      - "bisa post, DM, follow, like — semua yang aplikasinya bisa"
    drawbacks:
      - "melanggar syarat layanan. Instagram melarang akses otomatis tanpa izin tertulis Meta"
      - "X menyebut scripting situs non-API bisa berujung penangguhan permanen"
      - "kredensial akun kamu tersimpan di server — kalau VPS jebol, akunnya ikut"
      - "endpoint internal berubah tanpa pemberitahuan; hari ini jalan, Jumat depan mati"
      - "deteksi Meta membaik terus. 'Teman saya sudah setahun aman' bukan bukti"
      - "instagrapi (6.628 bintang) lisensinya NOASSERTION — status hukum pemakaiannya tidak jelas"
    implications:
      - "kalau akun kamu satu-satunya kanal jualan, ini mempertaruhkan bisnisnya untuk menghemat 20 menit sehari"
      - "kalau akunnya akun tes yang kamu ikhlas hilang, ini keputusan yang wajar dan biayanya kecil"
      - "pertanyaan yang menentukan bukan 'aman atau tidak' — tapi 'kalau akun ini hilang besok, apa yang terjadi pada omzet bulan depan?'"
    when_to_pick:
      - "akun percobaan yang kamu ikhlas kehilangan"
      - "riset/scraping data publik untuk keperluan analisis, bukan publish"
      - "kamu sudah menghitung nilai akunnya dan tetap memilih ini — itu keputusanmu"
    when_not_to:
      - "akun utama bisnis"
      - "akun klien (kamu mempertaruhkan aset orang lain)"
      - "kamu belum pernah kehilangan akun dan mengira itu tidak akan terjadi"
    safer_shape:
      - "pisahkan baca dan tulis: pakai jalur tidak resmi hanya untuk MEMBACA data publik (riset kompetitor, tren hashtag), dan jalur resmi untuk MENULIS. Sebagian besar nilai ada di sisi baca, dan sisi baca jauh lebih jarang memicu blokir"
      - "kalau tetap menulis: akun terpisah, volume rendah, jeda acak, dan siapkan diri kehilangan akunnya"
    alternatives: [official-api, browser-tailscale, manual-native]
    evidence: [repo-stats, instagram-terms, x-automation-rules]
    persona_fit: []

# ===========================================================================
# Pertanyaan yang menentukan, sebelum semua tabel di atas
# ===========================================================================
decision_frame:
  first_question: >
    "Kalau akun ini hilang besok pagi, apa yang terjadi pada omzet bulan depan?"
  why: >
    Semua perbandingan biaya dan fitur di file ini tidak ada artinya sebelum
    pertanyaan itu dijawab. Akun yang bisa diganti dalam seminggu dan akun yang
    menyumbang 80% pemasukan bukan aset yang sama, walau tampilannya identik.
  second_question: >
    "Berapa post per minggu yang benar-benar kamu terbitkan bulan lalu?"
  why_second: >
    Bukan berapa yang kamu rencanakan. Berapa yang benar-benar tayang. Hampir
    semua orang menjawab angka 3-5x lebih besar dari kenyataan, lalu memilih
    jalur yang jauh lebih rumit dari yang mereka butuhkan.
