    claims:
      - "#78602 — alur browser-cron Instagram/WhatsApp 5 menit: dilaporkan ~70% run gagal"
      - "#54879 — composer X gagal menerima teks (kasus input Korea)"
      - "#41483 — percakapan salah rute antar-akun"
      - "#8824 — profil/sesi browser tidak stabil"
