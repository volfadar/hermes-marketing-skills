    claims:
      - "Free: connect up to 3 channels, 10 scheduled posts per channel"
      - "Essentials $5/month per channel"
      - "Team $10/month per channel"
      - "kanal: Instagram, Facebook, TikTok, LinkedIn, X, YouTube, Threads, Pinterest, Google Business Profile, Bluesky, Mastodon"
    note: >
      Harga per KANAL, bukan per akun. Tiga kanal di Essentials = $15/bulan,
      bukan $5. Ini sumber salah hitung paling sering saat membandingkan
      dengan self-host.

  - id: repliz-home
    confidence: green
    verified: 2026-08-13
    url: https://repliz.com/
    title: "Repliz — Social Media Comment Automation"
    claims:
      - "otomasi: balas komentar, hapus komentar, like komentar, komentar→DM, balas DM"
      - "Content Management: jadwalkan & terbitkan posting tanpa membuka tiap aplikasi"
      - "Unified Inbox untuk semua percakapan"
      - "Public API + webhook, disebut 'developer-ready endpoints ... with managed storage'"
      - "AI Integration: pakai API key sendiri ATAU beli Token Balance di dalam Repliz"
      - "integrasi disebut di halaman depan: Facebook, Instagram, Threads, TikTok, YouTube, LinkedIn"
      - "FAQ: 'We strictly use a one-time payment model ... no auto-renewals'"
    note: >
      Buatan Indonesia. LinkedIn muncul di halaman depan tapi TIDAK muncul di
      tabel perbandingan paket — jangan janjikan LinkedIn sebelum dicek di akun.
      Klaim "sekali bayar" adalah klaim vendor tentang produknya sendiri;
      sampaikan apa adanya, jangan dijadikan jaminan.

  - id: repliz-pricing
    confidence: green
    verified: 2026-08-13
    url: https://repliz.com/pricing
    title: "Repliz — pricing & feature comparison"
    claims:
      - "Free Rp0: 1 akun, tanpa operator, TANPA Public API, TANPA webhook"
      - "Standard Rp18.000: 20 akun, 1 operator, Public API Limited, webhook"
      - "Premium Rp29.000: 75 akun, 10 operator, Public API Limited, webhook"
      - "Gold Rp49.000: 200 akun, 30 operator, Public API Full Access, webhook"
      - "ada pengali periode 1/3/6/12 bulan; angka di atas tampilan awal (1 bulan)"
      - "platform di tabel paket: Facebook, Instagram, Threads, TikTok, YouTube"
      - "Research: Hashtag TikTok, Content TikTok, Content Threads"
    note: >
      Untuk dipakai bersama Hermes minimum Standard — paket Free tidak punya API
      maupun webhook. Halaman /documentation GAGAL dibuka pada 13 Agu 2026, jadi
      tidak ada endpoint, skema auth, atau bentuk payload yang tercatat di repo
      ini. Buka dokumentasinya di sesi berjalan sebelum menulis integrasi.

