# sources.yaml — setiap klaim di skill ini punya asal-usulnya di sini.
#
# Tingkat keyakinan (dipinjam dari legenda Report C, karena legendanya bagus):
#   green  🟢  sumber primer, dibuka langsung, angkanya ada di halamannya
#   yellow 🟡  laporan komunitas berulang (Reddit/HN/GitHub issue), banyak orang
#   orange 🟠  satu sumber saja, atau tidak bisa diverifikasi ulang
#   red    🔴  klaim vendor tentang produknya sendiri — perlakukan sebagai iklan
#
# `verified` = tanggal seseorang benar-benar membuka halaman itu.
# Kalau umurnya sudah lebih dari 3 bulan, buka lagi sebelum dipakai mengajar.

meta:
  compiled_from:
    - hermes-openclaw-social-automation-deep-research-2026-08-11.md   # Report A
    - deep-research-social-automation-hermes-openclaw.md              # Report C
    - 01-Hermes-OpenClaw-Social-Automation.pdf                        # Report B — lihat catatan
  note_report_b: >
    Report B tidak dipakai sebagai sumber di file ini. Premis utamanya —
    bahwa X API "sering menghabiskan $100 per bulan" — terbantah oleh halaman
    harga X sendiri, dan catatan kakinya mengarah ke blog vendor yang menjual
    jembatan X seharga $11,99/bulan, produk yang kemudian direkomendasikannya.
    Nol kutipan primer dari platform. Disimpan di repo sebagai bahan ajar
    tentang cara mengenali riset yang terdengar meyakinkan tapi kosong.

