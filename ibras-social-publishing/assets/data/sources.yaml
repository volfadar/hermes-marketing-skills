  # ------------------------------------------------ bukti kegagalan (penting)
  - id: postiz-issues
    confidence: yellow
    verified: 2026-08-11
    url: https://github.com/gitroomhq/postiz-app/issues/832
    title: Laporan keandalan Postiz di issue tracker-nya sendiri
    claims:
      - "#832 — Continuous Reposting Loop for Standalone Instagram Integration - Risk! Account flagged"
      - "#1724 — post Instagram tersangkut di status QUEUE"
      - "#1581 — reply/CTA terjadwal X tidak ikut terkirim"
      - "#1364 — Threads: publish teks jalan, publish gambar gagal"
      - "#1259 — post terjadwal terlewat, padahal 'Post Now' jalan"
    note: >
      Kelima issue ini judulnya sudah dicek satu per satu lewat GitHub API,
      bukan dikutip dari ringkasan orang lain. Pola yang muncul: yang gagal
      adalah SCHEDULER-nya, sementara "Post Now" jalan — artinya bug ini
      justru tidak terlihat saat kamu mencoba di depan kelas.

  - id: openclaw-browser-issues
