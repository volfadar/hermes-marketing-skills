  - id: x-pricing
    confidence: green
    verified: 2026-08-12
    url: https://docs.x.com/x-api/getting-started/pricing
    title: X API pay-per-usage pricing and credits
    claims:
      - "Post: Create — $0.015 per request"
      - "Post: Create (with URL) — $0.200 per request"
    note: >
      Ini membalik anggapan umum bahwa memposting ke X butuh langganan
      $100–200/bulan. Untuk 20 post/bulan tanpa URL, biayanya $0,30.
      Post dengan URL 13x lebih mahal — itu detail yang mengubah cara kamu
      menulis caption.

